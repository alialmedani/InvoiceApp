name: invoice
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  animated_snack_bar: ^0.4.0
  bloc: ^9.2.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  get_it: ^8.2.0
  google_fonts: ^6.3.2
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  location: ^8.0.1
  meta: ^1.16.0
  package_info_plus: ^8.1.2
  page_animation_transition: ^1.0.0
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  pull_to_refresh: ^2.0.0
  shadcn_ui: ^0.27.0
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/Gif/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
